services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: helpdev-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: helpdev
    volumes:
      - helpdev_pgdata:/var/lib/postgresql/data

volumes:
  helpdev_pgdata:
